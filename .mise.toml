[tools]
python = "3.14.7"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.bootstrap]
description = "Install the project and optional GTK viewer into the Mise environment"
run = "python -m pip install -e '.[viewer]'"

[tasks.test]
description = "Run the complete unit-test suite"
run = "python -m unittest discover -s tests -v"

[tasks.check]
description = "Run syntax, formatting-hygiene, and unit checks"
run = [
  "python -m compileall -q src tests",
  "python -m tabnanny src tests",
  "python -m unittest discover -s tests -v",
]
