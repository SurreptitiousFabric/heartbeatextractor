[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session-journal"
version = "0.1.0"
description = "Build concise journals from visible Codex session heartbeats"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-journal = "codex_journal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
